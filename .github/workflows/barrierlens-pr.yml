name: BarrierLens Autonomous PR Gatekeeper

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  barrierlens-gatekeeper:
    name: Task-Conditioned Accessibility & Effort Ratio Gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify Mathematical Determinism Suites
        run: |
          npm run test:differentiators
          npm run test:phase2

      - name: Start Next.js Application in Background
        run: |
          npm run start -- -p 3000 &
          npx wait-on http://127.0.0.1:3000/benchmark --timeout 60000

      - name: Run BarrierLens Autonomous PR Gatekeeper
        run: |
          npx tsx scripts/barrierlens-ci.mjs \
            --url="http://127.0.0.1:3000/benchmark" \
            --goal="Navigate primary flows, test keyboard trap escape, and ensure accessible names" \
            --persona="keyboard" \
            --budget=3.5 \
            --junit-out="test-results/barrierlens.xml" \
            --json-out="test-results/barrierlens-run.json" \
            --pr-comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barrierlens-audit-reports
          path: |
            test-results/barrierlens.xml
            test-results/barrierlens-run.json
