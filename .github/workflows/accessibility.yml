name: BarrierLens Agentic Accessibility CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  accessibility-audit:
    name: Autonomous Accessibility Audit & Trap Certification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run Focus Graph & Keyboard Trap Certifications
        run: node scripts/verify-week2-focus-engine.mjs

      - name: Run AccName Provenance & Static WCAG Checks
        run: node scripts/verify-week3-accname-wcag.mjs

      - name: Publish Self-Audit Status Badge
        if: success()
        run: echo "BarrierLens self-audit passed with 100% mathematical certainty."
