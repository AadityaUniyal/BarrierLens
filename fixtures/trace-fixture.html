<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarrierLens Trace Engine Fixture</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f0f0f5;
      --text-muted: #8e8e93;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --radius: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 640px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="email"], select, textarea {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.25);
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .button-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .status-banner {
      padding: 12px 16px;
      background: rgba(0, 113, 227, 0.15);
      border: 1px solid rgba(0, 113, 227, 0.3);
      border-radius: 8px;
      font-size: 13px;
      color: #80bfff;
      margin-top: 16px;
    }
    dialog {
      background: #1c1c1e;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 24px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Profile & Accessibility Preferences</h1>
      <p style="color: var(--text-muted); font-size: 14px;">BarrierLens automated replay test harness.</p>
    </header>

    <main>
      <form id="profile-form" onsubmit="event.preventDefault()">
        <div class="form-group">
          <label for="user-name">Full Name</label>
          <input type="text" id="user-name" name="userName" placeholder="Alex Morgan" required />
        </div>

        <div class="form-group">
          <label for="user-email">Email Address</label>
          <input type="email" id="user-email" name="userEmail" placeholder="alex@barrierlens.ai" required />
        </div>

        <div class="form-group">
          <label for="department-select">Department</label>
          <select id="department-select" name="department" required>
            <option value="">Select Department...</option>
            <option value="engineering">Engineering</option>
            <option value="design">Design</option>
            <option value="accessibility">Accessibility Operations</option>
          </select>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="agree-terms" name="agreeTerms" />
          <label for="agree-terms" style="margin:0; cursor:pointer;">I accept the automated audit terms</label>
        </div>

        <div class="button-group">
          <button type="submit" id="submit-form-btn" class="btn-primary">Submit Profile</button>
          <button type="button" id="open-dialog-btn" class="btn-secondary" aria-haspopup="dialog">Open Support Dialog</button>
        </div>

        <div id="submission-result" class="status-banner" role="status" aria-live="polite" data-state="idle">
          Form not submitted.
        </div>
      </form>

      <dialog id="support-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <h2 id="dialog-title" style="margin-top:0; font-size:18px;">Support & Feedback</h2>
        <div class="form-group">
          <label for="dialog-message">Message Note</label>
          <textarea id="dialog-message" rows="3" placeholder="Provide additional feedback..."></textarea>
        </div>
        <div id="dialog-status" role="status" style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">
          Dialog initialized.
        </div>
        <div class="button-group" style="margin-bottom:0;">
          <button type="button" id="save-dialog-btn" class="btn-primary">Save Note</button>
          <button type="button" id="close-dialog-btn" class="btn-secondary">Close</button>
        </div>
      </dialog>
    </main>
  </div>

  <script>
    const form = document.getElementById('profile-form');
    const resultBanner = document.getElementById('submission-result');
    const dialog = document.getElementById('support-dialog');
    const openDialogBtn = document.getElementById('open-dialog-btn');
    const closeDialogBtn = document.getElementById('close-dialog-btn');
    const saveDialogBtn = document.getElementById('save-dialog-btn');
    const dialogMsg = document.getElementById('dialog-message');
    const dialogStatus = document.getElementById('dialog-status');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('user-name').value;
      const email = document.getElementById('user-email').value;
      const dept = document.getElementById('department-select').value;
      const terms = document.getElementById('agree-terms').checked;

      resultBanner.dataset.state = 'submitted';
      resultBanner.dataset.name = name;
      resultBanner.dataset.email = email;
      resultBanner.dataset.department = dept;
      resultBanner.dataset.terms = terms ? 'true' : 'false';

      resultBanner.textContent = `Profile confirmed: ${name} (${email}) in ${dept}. Terms accepted: ${terms ? 'Yes' : 'No'}.`;
    });

    openDialogBtn.addEventListener('click', () => {
      if (typeof dialog.showModal === 'function') {
        dialog.showModal();
      } else {
        dialog.setAttribute('open', '');
      }
      dialogStatus.textContent = 'Dialog opened and focused.';
      dialog.dataset.open = 'true';
    });

    saveDialogBtn.addEventListener('click', () => {
      const msg = dialogMsg.value;
      dialogStatus.textContent = `Note saved: "${msg}"`;
      dialogStatus.dataset.savedNote = msg;
    });

    closeDialogBtn.addEventListener('click', () => {
      if (typeof dialog.close === 'function') {
        dialog.close();
      } else {
        dialog.removeAttribute('open');
      }
      dialogStatus.textContent = 'Dialog closed.';
      dialog.dataset.open = 'false';
      resultBanner.dataset.dialogClosed = 'true';
    });
  </script>
</body>
</html>
